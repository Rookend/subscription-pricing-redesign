<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator pricing — simple, transparent plans</title>
<meta name="description" content="A simple creator plan with powerful publishing, community, growth, and podcast tools.">
<style>
:root{--ink:#080808;--soft:#999;--check:#c9c9c9;--green:#aac093;--pale:#e4e8dc;--paper:#fff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--green)}button,input{font:inherit}.page{min-height:100vh;background:linear-gradient(to bottom,var(--pale) 0 100px,var(--green) 100px)}.panel{position:relative;width:min(473px,100%);min-height:1209px;margin:0 auto;padding:37px 32px 8px;border-radius:27px 27px 0 0;background:var(--paper)}header{position:relative}h1{margin:0;color:var(--soft);font-size:31px;line-height:1.15;font-weight:500;letter-spacing:0}header>p{margin:6px 0 0;color:var(--soft);font-size:16px;line-height:20px}header>p strong{color:var(--ink);font-weight:650}.mark{position:absolute;top:-15px;left:190px;width:31px;height:38px;transform:rotate(13deg)}.mark i{position:absolute;display:block;background:var(--ink)}.mark i:first-child{top:0;left:0;width:29px;height:27px;border-radius:50% 50% 44% 46%}.mark i:last-child{bottom:0;left:2px;width:13px;height:26px;border-radius:8px}.rate-row{display:grid;grid-template-columns:183px 1fr;align-items:start;margin-top:16px}.rate{font-size:76px;line-height:.9;font-weight:300;letter-spacing:-3px}.rate-copy{padding-top:4px}.rate-copy strong{display:block;font-size:16px;line-height:17px}.rate-copy small{display:block;max-width:205px;margin-top:3px;color:#b8b8b8;font-size:7px;line-height:8px;text-decoration:underline}.features{margin-top:31px}.group{margin:0 0 21px}.group h2{margin:0 0 17px;font-size:16px;line-height:19px;font-weight:700}.group ul{display:grid;gap:21px;margin:0;padding:0;list-style:none}.group li{display:flex;align-items:flex-start;gap:10px;font-size:16px;line-height:24px;font-weight:500}.check{flex:0 0 14px;color:var(--check);font-size:21px;line-height:21px}.btn{min-height:44px;border:0;border-radius:999px;background:var(--ink);color:#fff;cursor:pointer;transition:opacity .14s,transform .14s}.btn:hover{opacity:.82}.btn:active{transform:scale(.99)}.btn:focus-visible,input:focus-visible{outline:3px solid #7e9270;outline-offset:3px}.start{position:absolute;right:32px;bottom:8px;left:32px;width:calc(100% - 64px);font-size:14px}.backdrop{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:#0009}.backdrop.open{display:grid}.dialog{position:relative;width:min(410px,100%);padding:34px;border-radius:8px;background:#fff;box-shadow:0 24px 80px #0005;animation:appear .18s ease-out}.close{position:absolute;top:8px;right:8px;display:grid;place-items:center;min-width:44px;min-height:44px;border:0;background:transparent;font-size:28px;cursor:pointer}.dialog h2{margin:0;font-size:29px}.dialog p{margin:8px 0 25px;color:#777}.dialog label{display:block;margin-bottom:7px;font-size:14px;font-weight:700}.dialog input{width:100%;height:48px;padding:0 13px;border:1px solid #ccc;border-radius:6px}.dialog form>.btn,.success>.btn{width:100%;margin-top:18px}.success{text-align:center}.success-mark{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 16px;border-radius:50%;background:var(--green);font-size:26px}@keyframes appear{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:520px){.page{background:#fff}.panel{padding-inline:24px;border-radius:0}.start{right:24px;left:24px;width:calc(100% - 48px)}.rate-row{grid-template-columns:48% 52%}.mark{left:48%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="page"><article class="panel" aria-labelledby="title"><header><div class="mark" aria-hidden="true"><i></i><i></i></div><h1 id="title">Creator pricing</h1><p>Creator is free to start. You only pay when you start <strong>earning.</strong></p><div class="rate-row"><span class="rate">10%</span><div class="rate-copy"><strong>of the income you earn on<br>Creator</strong><small>Plus payment processing, currency conversion, and payout fees, and applicable taxes.</small></div></div></header><div class="features" id="features"></div><button class="btn start" id="start">Get started</button></article></main><div class="backdrop" id="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><button class="close" id="close" aria-label="Close">×</button><div id="dialogBody"><form id="form"><h2 id="dialogTitle">Start creating</h2><p>Enter your email to join Creator.</p><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="254" required autocomplete="email" placeholder="you@example.com"><button class="btn" type="submit">Continue</button></form></div></div></div>
<script>
const groups=[["Earn from your work",["Monthly and annual subscriptions","Membership tiers","One-time payments"]],["Create your own space",["Audio, images and rich text editing","Native video and livestreaming","Email newsletters"]],["Build a thriving community.",["Chats, DMs and comments","Exportable email lists"]],["Grow your business",["Automated growth tools","Member analytics and insights","Free trials, discounts and sales","Creator-first discovery"]],["Manage your podcast",["Podcast importing and syncing","Support for multiple podcasts","Spotify integration and Synced Feeds","Distribute your episodes via RSS"]]];document.getElementById('features').innerHTML=groups.map(([h,x])=>`<section class="group"><h2>${h}</h2><ul>${x.map(i=>`<li><span class="check" aria-hidden="true">✓</span>${i}</li>`).join('')}</ul></section>`).join('');const b=document.getElementById('backdrop'),body=document.getElementById('dialogBody');function open(){b.classList.add('open');document.getElementById('email').focus()}function close(){b.classList.remove('open')}document.getElementById('start').onclick=open;document.getElementById('close').onclick=close;b.onmousedown=e=>{if(e.target===b)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};document.getElementById('form').onsubmit=e=>{e.preventDefault();if(!e.currentTarget.checkValidity())return;body.innerHTML='<div class="success" role="status"><span class="success-mark">✓</span><h2 id="dialogTitle">You’re on the list</h2><p>We’ll send your invitation soon.</p><button class="btn" id="done">Done</button></div>';document.getElementById('done').onclick=close};
</script></body></html>
